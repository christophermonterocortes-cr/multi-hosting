<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Chassis Base Plate -->
  <rect width="32" height="32" rx="4" fill="#101216"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="3.5" stroke="#2a303c" stroke-width="1"/>

  <!-- Top 1U Blade Slot -->
  <rect x="4" y="6" width="24" height="8" rx="1" fill="#181b22" stroke="#3b4354" stroke-width="1"/>
  <!-- Amber Status Filament LED -->
  <circle cx="8" cy="10" r="1.75" fill="#ffaa00"/>
  <!-- Hardware Socket Trace -->
  <line x1="13" y1="10" x2="24" y2="10" stroke="#e6edf3" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="4 2"/>

  <!-- Bottom 1U Blade Slot -->
  <rect x="4" y="18" width="24" height="8" rx="1" fill="#181b22" stroke="#3b4354" stroke-width="1"/>
  <!-- Amber Status Filament LED -->
  <circle cx="8" cy="22" r="1.75" fill="#ffaa00"/>
  <!-- Hardware Socket Trace -->
  <line x1="13" y1="22" x2="24" y2="22" stroke="#e6edf3" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="4 2"/>
</svg>
