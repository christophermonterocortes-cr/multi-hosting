version: '3.8'

services:
  # Reverse Proxy Gateway (Nginx with SSL & Rate Limiting)
  gateway:
    image: nginx:alpine
    container_name: multihosting_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - multihosting_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multihosting_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - SERVER_IP=${SERVER_IP}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATA_DIR=/app/data
      - DOCKER_SOCKET=/var/run/docker.sock
      - MANAGED_POSTGRES_HOST=postgres-managed
      - MANAGED_POSTGRES_PORT=5432
      - MANAGED_POSTGRES_ADMIN_USER=postgres
      - MANAGED_POSTGRES_ADMIN_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
      - MANAGED_MYSQL_HOST=mariadb-managed
      - MANAGED_MYSQL_PORT=3306
      - MANAGED_MYSQL_ADMIN_USER=root
      - MANAGED_MYSQL_ADMIN_PASSWORD=${MYSQL_ADMIN_PASSWORD}
      - PORT_RANGE_START=16000
      - PORT_RANGE_END=20000
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./sample-templates:/app/sample-templates:ro
      - ./runtimes:/app/runtimes:ro
    depends_on:
      - postgres-managed
      - mariadb-managed
    networks:
      - multihosting_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multihosting_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - multihosting_net

  postgres-managed:
    image: postgres:16-alpine
    container_name: multihosting_managed_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - multihosting_net

  mariadb-managed:
    image: mariadb:11.2
    container_name: multihosting_managed_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ADMIN_PASSWORD}
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    networks:
      - multihosting_net

volumes:
  postgres_prod_data:
  mariadb_prod_data:

networks:
  multihosting_net:
    driver: bridge
